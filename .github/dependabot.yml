version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      composer-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: composer
    directory: /theme
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      theme-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: composer
    directory: /plugin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      plugin-minor-patch:
        update-types: [minor, patch]
