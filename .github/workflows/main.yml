name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: npm install -g npm@11.20.0
      - run: npm ci
      - run: composer install --prefer-dist --no-interaction
      - run: composer install --working-dir=theme --prefer-dist --no-interaction
      - run: composer install --working-dir=plugin --prefer-dist --no-interaction
      - run: npm run check
      - run: npm start
      - run: npm test
      - run: npm run release
      - run: npm stop
        if: always()
